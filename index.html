<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uki Kooking</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  color: white;

  background:
    radial-gradient(circle at 10% 10%, #294d7a, transparent 35%),
    radial-gradient(circle at 90% 90%, #44366e, transparent 35%),
    #0b1020;

  display: flex;
  flex-direction: column;
}

header {
  padding: 22px 8%;
  background: rgba(8,13,27,.75);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.logo span {
  color: #7fb3ff;
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 15px;
}

.card {
  width: 100%;
  max-width: 650px;
  padding: 45px;

  background: rgba(255,255,255,.055);

  border: 1px solid rgba(255,255,255,.09);

  border-radius: 30px;

  backdrop-filter: blur(20px);

  box-shadow: 0 25px 70px rgba(0,0,0,.35);
}

.icon {
  text-align: center;
  font-size: 65px;
  margin-bottom: 15px;
}

h1 {
  text-align: center;
  font-size: 50px;
  margin-bottom: 12px;
}

h1 span {
  color: #7fb3ff;
}

.subtitle {
  text-align: center;
  color: #9aa8c2;
  line-height: 1.6;
  margin-bottom: 35px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

label {
  color: #bdc9dd;
  font-size: 14px;
  margin-top: 5px;
}

input,
select {
  width: 100%;
  padding: 16px;

  border: none;
  border-radius: 14px;

  background: #12192d;
  color: white;

  font-size: 16px;
  outline: none;
}

input::placeholder {
  color: #66738b;
}

input:focus,
select:focus {
  box-shadow: 0 0 0 3px rgba(127,179,255,.25);
}

select {
  cursor: pointer;
}


/* CUSTOM AMOUNT */

#customAmountContainer {
  display: none;
}

#customAmountContainer.visible {
  display: flex;
  flex-direction: column;
  gap: 8px;
}


/* BUTTON */

button {
  margin-top: 10px;

  padding: 17px;

  border: none;
  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #5ea2ff,
      #7a6cff
    );

  color: white;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  transform: translateY(-2px);
}

footer {
  padding: 22px;
  text-align: center;
  color: #66738b;
  font-size: 14px;
}

@media (max-width: 600px) {

  .card {
    padding: 30px 22px;
  }

  h1 {
    font-size: 40px;
  }

}

</style>

</head>


<body>


<header>

  <div class="logo">
    🍳 Uki <span>Kooking</span>
  </div>

</header>


<main>

<div class="card">

  <div class="icon">
    🍽️
  </div>

  <h1>
    Uki <span>Kooking</span>
  </h1>

  <p class="subtitle">
    Request a meal and choose when you'd like it.
  </p>


  <form
    action="http://formspree.io/f/xvkpjaly"
    method="POST"
  >


    <label for="name">
      👤 Your Name
    </label>

    <input
      id="name"
      name="name"
      type="text"
      placeholder="Enter your name"
      required
    >


    <label for="food">
      🍔 Food
    </label>

    <input
      id="food"
      name="food"
      type="text"
      placeholder="What would you like?"
      required
    >


    <label for="date">
      📅 Date
    </label>

    <input
      id="date"
      name="date"
      type="date"
      required
    >


    <label for="time">
      ⏰ Time
    </label>

    <input
      id="time"
      name="time"
      type="time"
      required
    >


    <label for="tip">
      💸 Tip
    </label>

    <select
      id="tip"
      name="tip"
      onchange="handleTipChange(this)"
    >

      <option value="€0">
        No tip
      </option>

      <option value="€1">
        €1
      </option>

      <option value="€2">
        €2
      </option>

      <option value="€5">
        €5
      </option>

      <option value="€10">
        €10
      </option>

      <option value="€15">
        €15
      </option>

      <option value="custom">
        Custom Amount
      </option>

    </select>


    <!-- THIS ONLY APPEARS FOR CUSTOM AMOUNT -->

    <div id="customAmountContainer">

      <label for="customAmount">
        💰 Custom Amount
      </label>

      <input
        id="customAmount"
        name="custom_amount"
        type="number"
        min="0"
        step="0.01"
        placeholder="Enter amount in €"
      >

    </div>


    <button type="submit">
      Request Meal
    </button>


  </form>

</div>

</main>


<footer>
  © 2026 Uki Kooking
</footer>


<script>

function handleTipChange(select) {

  const container =
    document.getElementById(
      "customAmountContainer"
    );

  const input =
    document.getElementById(
      "customAmount"
    );


  if (select.value === "custom") {

    container.classList.add("visible");

    input.required = true;

    setTimeout(function() {

      input.focus();

    }, 100);

  }

  else {

    container.classList.remove("visible");

    input.required = false;

    input.value = "";

  }

}

</script>


</body>

</html>
