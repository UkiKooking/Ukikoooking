<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uki Kooking</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
background:
radial-gradient(circle at 10% 10%,#294d7a,transparent 35%),
radial-gradient(circle at 90% 90%,#44366e,transparent 35%),
#0b1020;
color:white;
}

header{
padding:22px 8%;
background:rgba(8,13,27,.75);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{font-size:24px;font-weight:bold;}
.logo span{color:#7fb3ff;}

main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:30px 15px;
}

.card{
width:100%;
max-width:650px;
padding:40px;
background:rgba(255,255,255,.055);
border:1px solid rgba(255,255,255,.09);
border-radius:30px;
backdrop-filter:blur(20px);
box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.icon{
text-align:center;
font-size:60px;
margin-bottom:15px;
}

h1{
text-align:center;
font-size:48px;
margin-bottom:10px;
}

h1 span{color:#7fb3ff;}

.subtitle{
text-align:center;
color:#9aa8c2;
margin-bottom:30px;
}

form{
display:flex;
flex-direction:column;
gap:15px;
}

label{
color:#bdc9dd;
font-size:14px;
}

input,select,textarea{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#12192d;
color:white;
font-size:16px;
}

input:focus,
select:focus,
textarea:focus{
outline:none;
box-shadow:0 0 0 3px rgba(127,179,255,.25);
}

textarea{
min-height:90px;
resize:vertical;
}

#customTip{
display:none;
flex-direction:column;
gap:8px;
}

#requestBtn{
padding:18px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#5ea2ff,#7a6cff);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

#requestBtn:hover{
transform:translateY(-2px);
}

#requestBtn:disabled{
opacity:.6;
cursor:not-allowed;
}

#error{
display:none;
margin-top:15px;
padding:12px;
background:rgba(255,70,70,.15);
border-radius:12px;
text-align:center;
color:#ffb3b3;
}

#success{
display:none;
text-align:center;
}

.requestBox{
margin-top:18px;
padding:16px;
background:rgba(255,255,255,.06);
border-radius:14px;
}

.requestID{
font-size:28px;
font-weight:bold;
color:#7fb3ff;
margin-top:6px;
}

.newOrderBtn{
margin-top:20px;
width:100%;
padding:16px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#5ea2ff,#7a6cff);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

footer{
padding:20px;
text-align:center;
color:#66738b;
}

@media(max-width:600px){
.card{padding:28px 22px;}
h1{font-size:38px;}
}
</style>
</head>

<body>

<header>
<div class="logo">🍳 Uki <span>Kooking</span></div>
</header>

<main>

<div class="card">

<div id="formArea">

<div class="icon">🍽️</div>

<h1>Uki <span>Kooking</span></h1>

<p class="subtitle">Request a meal and choose when you'd like it.</p>

<form id="foodForm" action="https://formspree.io/f/xvkpjaly" method="POST">

<input type="hidden" id="requestID" name="request_id">

<label>👤 Your Name</label>
<input name="name" type="text" placeholder="Enter your name" required>

<label>📧 Your Email</label>
<input name="email" type="email" placeholder="Enter your email" required>

<label>🍔 Food</label>
<input name="food" type="text" placeholder="What would you like?" required>

<label>🔢 Quantity</label>
<input name="quantity" type="number" value="1" min="1" required>

<label>📝 Food Description</label>
<textarea name="description" placeholder="Extra cheese, no onions, special requests..."></textarea>

<label>📅 Date</label>
<input name="date" type="date" required>

<label>⏰ Time</label>
<input name="time" type="time" required>

<label>💸 Tip</label>

<select id="tip" name="tip">
<option value="€0">No tip</option>
<option value="€1">€1</option>
<option value="€2">€2</option>
<option value="€5">€5</option>
<option value="€10">€10</option>
<option value="€15">€15</option>
<option value="custom">Custom Amount</option>
</select>

<div id="customTip">

<label>💰 Custom Amount</label>

<input
id="customAmount"
name="custom_amount"
type="number"
min="0"
step="0.01"
placeholder="Enter amount in €">

</div>

<button id="requestBtn" type="submit">🍽️ Request Order</button>

</form>

<div id="error">
Couldn't send your request.
</div>

</div>

<div id="success">

<div class="icon">✅</div>

<h2>Request Sent!</h2>

<div class="requestBox">
<div>Your Request Number</div>
<div id="showID" class="requestID"></div>
</div>

<button class="newOrderBtn" id="newOrderBtn">
Make Another Order
</button>

</div>

</div>

</main>

<footer>© 2026 Uki Kooking</footer>

<script>
const tip=document.getElementById("tip");
const customTip=document.getElementById("customTip");
const customAmount=document.getElementById("customAmount");

tip.addEventListener("change",function(){

if(this.value==="custom"){
customTip.style.display="flex";
customAmount.required=true;
}else{
customTip.style.display="none";
customAmount.required=false;
customAmount.value="";
}

});

function requestNumber(){
return "#"+Math.floor(100000+Math.random()*900000);
}

const form=document.getElementById("foodForm");
const formArea=document.getElementById("formArea");
const success=document.getElementById("success");
const showID=document.getElementById("showID");
const hiddenID=document.getElementById("requestID");
const requestBtn=document.getElementById("requestBtn");
const error=document.getElementById("error");
const newOrderBtn=document.getElementById("newOrderBtn");

form.addEventListener("submit",async function(e){

e.preventDefault();

error.style.display="none";

const id=requestNumber();
hiddenID.value=id;

requestBtn.disabled=true;
requestBtn.textContent="Sending...";

try{

const res=await fetch(form.action,{
method:"POST",
body:new FormData(form),
headers:{Accept:"application/json"}
});

if(!res.ok) throw new Error();

showID.textContent=id;

formArea.style.display="none";
success.style.display="block";

}catch{

error.style.display="block";
requestBtn.disabled=false;
requestBtn.textContent="🍽️ Request Order";

}

});

newOrderBtn.addEventListener("click",function(){

success.style.display="none";
formArea.style.display="block";
form.reset();

customTip.style.display="none";
customAmount.required=false;

requestBtn.disabled=false;
requestBtn.textContent="🍽️ Request Order";

});
</script>

</body>
</html>
