<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Uki Kooking</title>


<style>

/* =========================
   BASIC
========================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family: Arial, sans-serif;

  min-height: 100vh;

  color: white;

  background:
    radial-gradient(
      circle at 10% 10%,
      #294d7a,
      transparent 35%
    ),

    radial-gradient(
      circle at 90% 90%,
      #44366e,
      transparent 35%
    ),

    #0b1020;

  display: flex;

  flex-direction: column;
}


/* =========================
   HEADER
========================= */

header {

  padding: 22px 8%;

  background:
    rgba(8,13,27,.75);

  backdrop-filter:
    blur(18px);

  border-bottom:
    1px solid rgba(255,255,255,.08);
}

.logo {

  font-size: 24px;

  font-weight: bold;
}

.logo span {

  color: #7fb3ff;
}


/* =========================
   MAIN
========================= */

main {

  flex: 1;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 30px 15px;
}


/* =========================
   CARD
========================= */

.card {

  width: 100%;

  max-width: 650px;

  padding: 45px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid rgba(255,255,255,.09);

  border-radius: 30px;

  backdrop-filter:
    blur(20px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.35);
}


/* =========================
   TITLE
========================= */

.icon {

  text-align: center;

  font-size: 65px;

  margin-bottom: 15px;
}

h1 {

  text-align: center;

  font-size: 50px;

  margin-bottom: 12px;
}

h1 span {

  color: #7fb3ff;
}

.subtitle {

  text-align: center;

  color: #9aa8c2;

  line-height: 1.6;

  margin-bottom: 35px;
}


/* =========================
   FORM
========================= */

form {

  display: flex;

  flex-direction: column;

  gap: 15px;
}

label {

  color: #bdc9dd;

  font-size: 14px;

  margin-top: 5px;
}

input,
select,
textarea {

  width: 100%;

  padding: 16px;

  border: none;

  border-radius: 14px;

  background: #12192d;

  color: white;

  font-size: 16px;

  outline: none;
}

input::placeholder,
textarea::placeholder {

  color: #66738b;
}

input:focus,
select:focus,
textarea:focus {

  box-shadow:
    0 0 0 3px
    rgba(127,179,255,.25);
}

select {

  cursor: pointer;
}

textarea {

  min-height: 100px;

  resize: vertical;
}


/* =========================
   SURPRISE BUTTON
========================= */

.surpriseButton {

  width: fit-content;

  padding:
    10px 18px;

  margin-left: -5px;

  border: none;

  border-radius: 12px;

  background:
    rgba(94,162,255,.35);

  border:
    1px solid
    rgba(255,255,255,.12);

  color: white;

  font-size: 14px;

  cursor: pointer;

  transition: .2s;
}

.surpriseButton:hover {

  transform:
    translateY(-2px);

  background:
    rgba(94,162,255,.5);
}


/* =========================
   CUSTOM TIP
========================= */

#customAmountContainer {

  display: none;

  flex-direction: column;

  gap: 8px;
}

#customAmountContainer.show {

  display: flex;
}


/* =========================
   REQUEST ORDER
========================= */

#requestOrderButton {

  display: block;

  width: 100%;

  margin-top: 12px;

  padding: 18px;

  border: none;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #5ea2ff,
      #7a6cff
    );

  color: white;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}

#requestOrderButton:hover {

  transform:
    translateY(-2px);
}

#requestOrderButton:disabled {

  opacity: .6;

  cursor: not-allowed;

  transform: none;
}


/* =========================
   ERROR
========================= */

#errorMessage {

  display: none;

  margin-top: 20px;

  padding: 15px;

  border-radius: 14px;

  background:
    rgba(255,70,70,.15);

  border:
    1px solid
    rgba(255,70,70,.3);

  color: #ff9a9a;

  text-align: center;
}


/* =========================
   SUCCESS
========================= */

#confirmation {

  display: none;

  text-align: center;
}

#confirmation h2 {

  color: #8ff0b0;

  font-size: 30px;

  margin-bottom: 12px;
}

.requestIDBox {

  margin-top: 20px;

  padding: 18px;

  border-radius: 14px;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid
    rgba(255,255,255,.08);
}

.requestIDLabel {

  color: #9aa8c2;

  font-size: 14px;

  margin-bottom: 7px;
}

.requestID {

  color: #7fb3ff;

  font-size: 28px;

  font-weight: bold;
}

.confirmationText {

  margin-top: 15px;

  color: #9aa8c2;

  line-height: 1.5;
}

.newOrderButton {

  width: 100%;

  margin-top: 25px;

  padding: 17px;

  border: none;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #5ea2ff,
      #7a6cff
    );

  color: white;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;
}


/* =========================
   FOOTER
========================= */

footer {

  padding: 22px;

  text-align: center;

  color: #66738b;

  font-size: 14px;
}


/* =========================
   PHONE
========================= */

@media (max-width: 600px) {

  .card {

    padding:
      30px 22px;
  }

  h1 {

    font-size: 40px;
  }

  .icon {

    font-size: 55px;
  }

}

</style>

</head>


<body>

     HEADER
========================= -->

<header>

  <div class="logo">

    🍳 Uki <span>Kooking</span>

  </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>


<div class="card">

      🔢 Quantity
