<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uki Kooking</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  color: white;

  background:
    radial-gradient(circle at 10% 10%, #294d7a, transparent 35%),
    radial-gradient(circle at 90% 90%, #44366e, transparent 35%),
    #0b1020;

  display: flex;
  flex-direction: column;
}

header {
  padding: 22px 8%;
  background: rgba(8,13,27,.75);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.logo span {
  color: #7fb3ff;
}

main {
  flex: 1;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 30px 15px;
}

.card {
  width: 100%;
  max-width: 650px;

  padding: 45px;

  background: rgba(255,255,255,.055);

  border: 1px solid rgba(255,255,255,.09);

  border-radius: 30px;

  backdrop-filter: blur(20px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.35);
}

.icon {
  text-align: center;

  font-size: 65px;

  margin-bottom: 15px;
}

h1 {
  text-align: center;

  font-size: 50px;

  margin-bottom: 12px;
}

h1 span {
  color: #7fb3ff;
}

.subtitle {
  text-align: center;

  color: #9aa8c2;

  line-height: 1.6;

  margin-bottom: 35px;
}

form {
  display: flex;

  flex-direction: column;

  gap: 15px;
}

label {
  color: #bdc9dd;

  font-size: 14px;

  margin-top: 5px;
}

input,
select,
textarea {
  width: 100%;

  padding: 16px;

  border: none;

  border-radius: 14px;

  background: #12192d;

  color: white;

  font-size: 16px;

  outline: none;
}

input::placeholder,
textarea::placeholder {
  color: #66738b;
}

input:focus,
select:focus,
textarea:focus {
  box-shadow:
    0 0 0 3px rgba(127,179,255,.25);
}

select {
  cursor: pointer;
}

textarea {
  min-height: 100px;

  resize: vertical;
}


/* =========================
   SURPRISE ME
========================= */

.surpriseButton {
  width: auto;

  align-self: flex-start;

  padding: 10px 18px;

  margin-top: 2px;
  margin-left: -5px;

  font-size: 14px;

  background:
    rgba(94,162,255,0.35);

  border:
    1px solid rgba(255,255,255,0.12);

  box-shadow: none;

  color: white;

  border-radius: 12px;

  cursor: pointer;

  transition: .2s;
}

.surpriseButton:hover {
  transform: translateY(-2px);

  background:
    rgba(94,162,255,0.5);
}


/* =========================
   REQUEST ORDER BUTTON
========================= */

.submitButton {
  width: 100%;

  margin-top: 10px;

  padding: 17px;

  border: none;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #5ea2ff,
      #7a6cff
    );

  color: white;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}

.submitButton:hover {
  transform: translateY(-2px);
}

.submitButton:disabled {
  opacity: .6;

  cursor: not-allowed;

  transform: none;
}


/* =========================
   CUSTOM AMOUNT
========================= */

#customAmountContainer {
  display: none;
}

#customAmountContainer.visible {
  display: flex;

  flex-direction: column;

  gap: 8px;
}


/* =========================
   SUCCESS
========================= */

#confirmation {
  display: none;

  text-align: center;

  margin-top: 5px;

  padding: 10px;
}

#confirmation h2 {
  color: #8ff0b0;

  margin-bottom: 12px;

  font-size: 28px;
}

.requestIDBox {
  margin-top: 18px;

  padding: 15px;

  border-radius: 14px;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid rgba(255,255,255,.08);
}

.requestIDLabel {
  color: #9aa8c2;

  font-size: 14px;

  margin-bottom: 6px;
}

.requestID {
  color: #7fb3ff;

  font-size: 26px;

  font-weight: bold;
}

.confirmationText {
  margin-top: 15px;

  color: #9aa8c2;

  line-height: 1.5;
}


/* =========================
   ERROR
========================= */

#errorMessage {
  display: none;

  margin-top: 20px;

  padding: 15px;

  border-radius: 14px;

  background:
    rgba(255,70,70,.15);

  border:
    1px solid rgba(255,70,70,.3);

  color: #ff9a9a;

  text-align: center;

  font-weight: bold;
}


/* =========================
   FOOTER
========================= */

footer {
  padding: 22px;

  text-align: center;

  color: #66738b;

  font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .card {
    padding: 30px 22px;
  }

  h1 {
    font-size: 40px;
  }

  .icon {
    font-size: 55px;
  }

}

</style>

</head>


<body>


<header>

  <div class="logo">
    🍳 Uki <span>Kooking</span>
  </div>

</header>


<main>

<div class="card">


<!-- =========================
     FORM AREA
========================= -->

<div id="formArea">


  <div class="icon">
    🍽️
  </div>


  <h1>
    Uki <span>Kooking</span>
  </h1>


  <p class="subtitle">
    Request a meal and choose when you'd like it.
  </p>


  <form
    id="foodForm"
    action="https://formspree.io/f/xvkpjaly"
    method="POST"
  >


    <!-- REQUEST ID -->

    <input
      id="hiddenRequestID"
      name="request_id"
      type="hidden"
    >


    <!-- NAME -->

    <label for="name">
      👤 Your Name
    </label>

    <input
      id="name"
      name="name"
      type="text"
      placeholder="Enter your name"
      autocomplete="name"
      required
    >


    <!-- EMAIL -->

    <label for="email">
      📧 Your Email
    </label>

    <input
      id="email"
      name="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >


    <!-- FOOD -->

    <label for="food">
      🍔 Food
    </label>

    <input
      id="food"
      name="food"
      type="text"
      placeholder="What would you like?"
      required
    >


    <!-- SURPRISE ME -->

    <button
      type="button"
      class="surpriseButton"
      onclick="surpriseMe()"
    >
      🎲 Surprise Me
    </button>


    <!-- QUANTITY -->

    <label for="quantity">
      🔢 Quantity
    </label>

    <input
      id="quantity"
      name="quantity"
      type="number"
      min="1"
      max="99"
      value="1"
      required
    >


    <!-- DESCRIPTION -->

    <label for="description">
      📝 Food Description
    </label>

    <textarea
      id="description"
      name="description"
      placeholder="Extra cheese, no onions, special requests..."
    ></textarea>


    <!-- DATE -->

    <label for="date">
      📅 Date
    </label>

    <input
      id="date"
      name="date"
      type="date"
      required
    >


    <!-- TIME -->

    <label for="time">
      ⏰ Time
    </label>

    <input
      id="time"
      name="time"
      type="time"
      required
    >


    <!-- TIP -->

    <label for="tip">
      💸 Tip
    </label>

    <select
      id="tip"
      name="tip"
      onchange="handleTipChange(this)"
    >

      <option value="€0">
        No tip
      </option>

      <option
